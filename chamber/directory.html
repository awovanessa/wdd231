<main>
  <div class="page">
    <div class="wrap">

      <h1 class="page-title">Abuja Chamber Directory</h1>

      <section aria-labelledby="directory-heading">
        <div class="section-head">
          <span class="checkbox done" aria-hidden="true"></span>
          <h2 id="directory-heading">Member Businesses</h2>
        </div>

        <div class="dir-toolbar">
          <div class="view-toggle" role="group" aria-label="Choose view">
            <button type="button" id="view-grid" class="active" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
              Grid
            </button>
            <button type="button" id="view-list" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="3"/><rect x="3" y="10.5" width="18" height="3"/><rect x="3" y="17" width="18" height="3"/></svg>
              List
            </button>
          </div>
          <p class="member-count"><strong id="member-count-value">0</strong> member businesses</p>
        </div>

        <!-- rows are rendered by scripts/directory.js -->
        <div class="is-grid" id="member-container"></div>
      </section>

    </div>
  </div>
